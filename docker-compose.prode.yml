services:
  caddy:
    image: caddy:latest
    container_name: caddy-prod
    environment:
      HOSTNAME: ${HOSTNAME:-localhost}
    volumes:
      - ./services/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "8000:80"
      - "8443:443"
    depends_on:
      - gateway
      - frontend
    networks:
      - frontend
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-hypertube}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./services/database:/docker-entrypoint-initdb.d
    networks:
      - DB
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  redis:
    image: redis:8-alpine
    networks:
      - DB
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    volumes:
      - redis_data_prod:/data
    tmpfs:
      - /tmp

  gateway:
    build:
      context: ./api/gateway
      target: production
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GIN_MODE: release
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_ADDR: redis:6379
    depends_on:
      - auth-service
      - user-service
      - library-service
      - torrent-service
      - comment-service
      - worker-service
    networks:
      - DB
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  auth-service:
    build:
      context: ./api/auth-service
      target: production
    environment:
      PORT: 8001
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-hypertube}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FROM_EMAIL: ${FROM_EMAIL}
      FROM_NAME: ${FROM_NAME}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:8443}
      OAUTH_42_CLIENT_ID: ${OAUTH_42_CLIENT_ID}
      OAUTH_42_CLIENT_SECRET: ${OAUTH_42_CLIENT_SECRET}
      OAUTH_42_REDIRECT_URI: ${OAUTH_42_REDIRECT_URI:-https://localhost:8443/api/v1/auth/oauth/42/callback}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET}
      OAUTH_GITHUB_REDIRECT_URI: ${OAUTH_GITHUB_REDIRECT_URI:-https://localhost:8443/api/v1/auth/oauth/github/callback}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-30}
    depends_on:
      - postgres
      - redis
    networks:
      - DB
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  user-service:
    build:
      context: ./api/user-service
      target: production
    environment:
      PORT: 8002
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-hypertube}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      GIN_MODE: release
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      AVATAR_DIR: /data/avatars
    volumes:
      - avatar_data:/data/avatars
    depends_on:
      - postgres
      - redis
    networks:
      - DB
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  library-service:
    build:
      context: ./api/library-service
      target: production
    environment:
      PORT: 8003
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-hypertube}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      TMDB_API_KEY: ${TMDB_API_KEY}
      REDIS_HOST: redis
      GIN_MODE: release
    depends_on:
      - postgres
      - redis
    networks:
      - DB
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  torrent-service:
    build:
      context: ./api/torrent-service
      target: production
    environment:
      PORT: 8004
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-hypertube}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      TORRENT_DOWNLOAD_PATH: /data/torrents
      STREAM_BUFFER_SIZE: ${STREAM_BUFFER_SIZE:-10}
      GIN_MODE: release
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY:-}
      OPENSUBTITLES_USERNAME: ${OPENSUBTITLES_USERNAME:-}
      OPENSUBTITLES_PASSWORD: ${OPENSUBTITLES_PASSWORD:-}
      SUBTITLE_CACHE_PATH: /data/subtitles
    volumes:
      - torrent_data_prod:/data/torrents
      - subtitle_data_prod:/data/subtitles
    depends_on:
      - postgres
    networks:
      - DB
      - backend
    user: "1001:1001"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  comment-service:
    build:
      context: ./api/comment-service
      target: production
    environment:
      PORT: 8005
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-hypertube}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      GIN_MODE: release
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    depends_on:
      - postgres
    networks:
      - DB
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker-service:
    build:
      context: ./api/worker-service
      target: production
    environment:
      PORT: 8006
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-hypertube}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      TORRENT_DOWNLOAD_PATH: /data/torrents
      GIN_MODE: release
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    volumes:
      - torrent_data_prod:/data/torrents
    depends_on:
      - postgres
      - redis
    networks:
      - DB
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      target: production
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_URL: http://caddy
      BASE_URL: ${BASE_URL:-https://localhost:8443}
    depends_on:
      - gateway
    networks:
      - frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

volumes:
  postgres_data_prod:
    driver: local
    driver_opts:
      type: none
      device: ./volumes/data
      o: bind
  redis_data_prod:
    driver: local
    driver_opts:
      type: none
      device: ./volumes/redis
      o: bind
  avatar_data:
    driver: local
    driver_opts:
      type: none
      device: ./volumes/avatars
      o: bind
  torrent_data_prod:
    driver: local
    driver_opts:
      type: none
      device: ./volumes/torrents
      o: bind
  subtitle_data_prod:
    driver: local
    driver_opts:
      type: none
      device: ./volumes/subtitles
      o: bind
  caddy_data:

networks:
  frontend:
  backend:
  DB:
